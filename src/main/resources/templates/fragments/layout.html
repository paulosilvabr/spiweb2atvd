<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<!-- Insere o fragmento 'head' passando a variável 'title' -->
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="d-flex flex-column min-vh-100">

<!-- Insere a Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- O miolo de cada tela vai entrar aqui -->
<main class="container flex-grow-1">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- Insere o Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
