<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Consultas do Paciente', ~{::content})}" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
    <div class="container">
        <h1 th:text="'Consultas do Paciente: ' + ${paciente.nome}">Consultas do Paciente</h1>

        <div th:if="${#lists.isEmpty(consultas)}">
            <p>Este paciente não possui consultas agendadas.</p>
        </div>

        <table th:unless="${#lists.isEmpty(consultas)}" class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Data</th>
                    <th>Médico</th>
                    <th>Valor</th>
                    <th>Observação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${consultas}">
                    <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${c.medico.nome}"></td>
                    <td th:text="${c.valor}"></td>
                    <td th:text="${c.observacao}"></td>
                </tr>
            </tbody>
        </table>

        <div class="mt-3">
            <a th:href="@{/paciente/list}" class="btn btn-primary">Voltar</a>
        </div>
    </div>
</th:block>
</html>
