<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Formulário de Paciente', ~{::content})}" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
    <div class="container">
        <h1 th:text="${paciente.id == null ? 'Novo Paciente' : 'Editar Paciente'}">Formulário</h1>

        <form th:action="@{${paciente.id == null ? '/paciente/save' : '/paciente/update'}}" th:object="${paciente}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" th:field="*{nome}" required>
            </div>

            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" id="cpf" class="form-control" th:field="*{cpf}" required>
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" id="telefone" class="form-control" th:field="*{telefone}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">email</label>
                <input type="text" id="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="d-flex mt-3">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a th:href="@{/paciente/list}" class="btn btn-danger">Cancelar</a>
            </div>
        </form>
    </div>
</th:block>
</html>
