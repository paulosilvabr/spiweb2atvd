<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${paciente.id == null} ? 'Novo Paciente' : 'Editar Paciente'">Formulário de Paciente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1 th:text="${paciente.id == null} ? 'Novo Paciente' : 'Editar Paciente'">Formulário</h1>
    </div>

    <nav class="nav-links">
        <a href="/pacientes">Pacientes</a>
        <a href="/medicos">Médicos</a>
        <a href="/consultas">Consultas</a>
    </nav>

    <div class="card">
        <form th:action="@{/pacientes/salvar}" method="post">
            <input type="hidden" name="id" th:value="${paciente.id}">

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" class="form-control"
                       th:value="${paciente.nome}" placeholder="Digite o nome completo">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" class="form-control"
                       th:value="${paciente.cpf}" placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" class="form-control"
                       th:value="${paciente.telefone}" placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" class="form-control"
                       th:value="${paciente.email}" placeholder="exemplo@email.com">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="/pacientes" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
