<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Paciente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/paciente/list}">Pacientes</a>
        <a th:href="@{/medico/list}">Médicos</a>
        <a th:href="@{/consulta/list}">Consultas</a>
    </nav>
    <div class="container">
        <h1 th:text="${paciente.id == null ? 'Novo Paciente' : 'Editar Paciente'}">Formulário</h1>
        
        <form th:action="@{${paciente.id == null ? '/paciente/save' : '/paciente/update'}}" th:object="${paciente}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" th:field="*{cpf}" required>
            </div>
            
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}" required>
            </div>

            <div class="form-group">
                <label for="email">email</label>
                <input type="text" id="email" th:field="*{email}" required>
            </div>
            
            <div class="d-flex mt-3">
                <button type="submit" class="btn">Salvar</button>
                <a th:href="@{/paciente/list}" class="btn btn-danger">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
