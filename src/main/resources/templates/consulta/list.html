<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Consultas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>Consultas</h1>
        <a href="/consultas/nova" class="btn btn-primary">+ Nova Consulta</a>
    </div>

    <nav class="nav-links">
        <a href="/pacientes">Pacientes</a>
        <a href="/medicos">Médicos</a>
        <a href="/consultas">Consultas</a>
    </nav>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Paciente</th>
                <th>Médico</th>
                <th>Valor</th>
                <th>Observação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="consulta : ${consultas}">
                <td th:text="${consulta.id}">1</td>
                <td th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy HH:mm')}">Data</td>
                <td th:text="${consulta.paciente.nome}">Paciente</td>
                <td th:text="${consulta.medico.nome}">Médico</td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(consulta.valor, 1, 2)}">Valor</td>
                <td th:text="${consulta.observacao}">Observação</td>
                <td class="acoes">
                    <a th:href="@{/consultas/editar/{id}(id=${consulta.id})}" class="btn btn-warning">Editar</a>
                    <a th:href="@{/consultas/excluir/{id}(id=${consulta.id})}" class="btn btn-danger"
                       onclick="return confirm('Deseja excluir esta consulta?')">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(consultas)}">
                <td colspan="7" class="text-center">Nenhuma consulta cadastrada.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
