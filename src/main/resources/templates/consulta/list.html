<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Consultas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/paciente/list}">Pacientes</a>
        <a th:href="@{/medico/list}">Médicos</a>
        <a th:href="@{/consulta/list}">Consultas</a>
    </nav>
    <div class="container">
        <h1>Agenda de Consultas</h1>
        <div class="d-flex" style="margin-bottom: 20px;">
            <a th:href="@{/consulta/form}" class="btn">Nova Consulta</a>
        </div>
        
        <div th:if="${#lists.isEmpty(consultas)}">
            <p>Nenhuma consulta agendada.</p>
        </div>
        
        <table th:unless="${#lists.isEmpty(consultas)}">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Paciente</th>
                    <th>Médico</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${consultas}">
                    <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${c.paciente.nome}"></td>
                    <td th:text="${c.medico.nome}"></td>
                    <td th:text="${c.valor}"></td>
                    <td class="d-flex">
                        <a th:href="@{/consulta/edit/{id}(id=${c.id})}" class="btn">Editar</a>
                        <a th:href="@{/consulta/remove/{id}(id=${c.id})}" class="btn btn-danger">Cancelar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
