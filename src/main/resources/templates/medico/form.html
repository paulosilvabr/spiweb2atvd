<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Médico</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/paciente/list}">Pacientes</a>
        <a th:href="@{/medico/list}">Médicos</a>
        <a th:href="@{/consulta/list}">Consultas</a>
    </nav>
    <div class="container">
        <h1 th:text="${medico.id == null ? 'Novo Médico' : 'Editar Médico'}">Formulário</h1>
        
        <form th:action="@{${medico.id == null ? '/medico/save' : '/medico/update'}}" th:object="${medico}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            
            <div class="form-group">
                <label for="crm">CRM</label>
                <input type="text" id="crm" th:field="*{crm}" required>
            </div>
            
            <div class="d-flex mt-3">
                <button type="submit" class="btn">Salvar</button>
                <a th:href="@{/medico/list}" class="btn btn-danger">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
