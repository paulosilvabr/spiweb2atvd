<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Formulário de Médico', ~{::content})}" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
    <div class="container">
        <h1 th:text="${medico.id == null ? 'Novo Médico' : 'Editar Médico'}">Formulário</h1>

        <form th:action="@{${medico.id == null ? '/medico/save' : '/medico/update'}}" th:object="${medico}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>

                <input type="text" id="nome"
                       th:field="*{nome}"
                       class="form-control"
                       th:errorclass="is-invalid" />

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('nome')}"
                     th:errors="*{nome}">
                </div>
            </div>

            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>

                <input type="text" id="cpf"
                       th:field="*{cpf}"
                       class="form-control"
                       th:errorclass="is-invalid" />

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('cpf')}"
                     th:errors="*{cpf}">
                </div>
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>

                <input type="text" id="telefone"
                       th:field="*{telefone}"
                       class="form-control"
                       th:errorclass="is-invalid" />

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('telefone')}"
                     th:errors="*{telefone}">
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>

                <input type="text" id="email"
                       th:field="*{email}"
                       class="form-control"
                       th:errorclass="is-invalid" />

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>
            </div>

            <div class="d-flex mt-3 gap-3">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a th:href="@{/medico/list}" class="btn btn-danger">Cancelar</a>
            </div>
        </form>
    </div>
</th:block>
</html>
