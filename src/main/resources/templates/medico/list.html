<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Médicos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>Médicos</h1>
        <a href="/medicos/novo" class="btn btn-primary">+ Novo Médico</a>
    </div>

    <nav class="nav-links">
        <a href="/pacientes">Pacientes</a>
        <a href="/medicos">Médicos</a>
        <a href="/consultas">Consultas</a>
    </nav>

    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>CRM</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="medico : ${medicos}">
                <td th:text="${medico.id}">1</td>
                <td th:text="${medico.nome}">Nome</td>
                <td th:text="${medico.cpf}">CPF</td>
                <td th:text="${medico.crm}">CRM</td>
                <td th:text="${medico.telefone}">Telefone</td>
                <td th:text="${medico.email}">Email</td>
                <td class="acoes">
                    <a th:href="@{/medicos/editar/{id}(id=${medico.id})}" class="btn btn-warning">Editar</a>
                    <a th:href="@{/medicos/excluir/{id}(id=${medico.id})}" class="btn btn-danger"
                       onclick="return confirm('Deseja excluir este médico?')">Excluir</a>
                    <a th:href="@{/medicos/{id}/consultas(id=${medico.id})}" class="btn btn-info">Ver Consultas</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(medicos)}">
                <td colspan="7" class="text-center">Nenhum médico cadastrado.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
