<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consultas do Médico</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a th:href="@{/paciente/list}">Pacientes</a>
        <a th:href="@{/medico/list}">Médicos</a>
        <a th:href="@{/consulta/list}">Consultas</a>
    </nav>
    <div class="container">
        <h1 th:text="'Consultas do Médico: ' + ${medico.nome}">Consultas do Médico</h1>
        
        <div th:if="${#lists.isEmpty(consultas)}">
            <p>Este médico não possui consultas agendadas.</p>
        </div>
        
        <table th:unless="${#lists.isEmpty(consultas)}">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Paciente</th>
                    <th>Valor</th>
                    <th>Observação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${consultas}">
                    <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${c.paciente.nome}"></td>
                    <td th:text="${c.valor}"></td>
                    <td th:text="${c.observacao}"></td>
                </tr>
            </tbody>
        </table>
        
        <div class="mt-3">
            <a th:href="@{/medico/list}" class="btn">Voltar</a>
        </div>
    </div>
</body>
</html>
