<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do Médico</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>Agenda de Consultas</h1>
        <span class="subtitle" th:text="'Médico: ' + ${medico.nome}">Médico</span>
    </div>

    <nav class="nav-links">
        <a href="/pacientes">Pacientes</a>
        <a href="/medicos">Médicos</a>
        <a href="/consultas">Consultas</a>
    </nav>

    <div class="info-card">
        <p><strong>Nome:</strong> <span th:text="${medico.nome}"></span></p>
        <p><strong>CPF:</strong> <span th:text="${medico.cpf}"></span></p>
        <p><strong>CRM:</strong> <span th:text="${medico.crm}"></span></p>
        <p><strong>Telefone:</strong> <span th:text="${medico.telefone}"></span></p>
        <p><strong>E-mail:</strong> <span th:text="${medico.email}"></span></p>
    </div>

    <h2>Consultas Agendadas</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Data</th>
                <th>Paciente</th>
                <th>Valor</th>
                <th>Observação</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="consulta : ${consultas}">
                <td th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy HH:mm')}">Data</td>
                <td th:text="${consulta.paciente.nome}">Paciente</td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(consulta.valor, 1, 2)}">Valor</td>
                <td th:text="${consulta.observacao}">Observação</td>
            </tr>
            <tr th:if="${#lists.isEmpty(consultas)}">
                <td colspan="4" class="text-center">Nenhuma consulta encontrada para este médico.</td>
            </tr>
        </tbody>
    </table>

    <div class="form-actions">
        <a href="/medicos" class="btn btn-secondary">Voltar</a>
    </div>
</div>
</body>
</html>
